services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_toko_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./storage/app/public:/var/www/storage/app/public
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    networks:
      - saas-network

  web:
    image: nginx:alpine
    container_name: saas_toko_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - saas-network

  db:
    image: mysql:8.0
    container_name: saas_toko_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-saas_toko}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - saas-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: saas_toko_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - db
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
